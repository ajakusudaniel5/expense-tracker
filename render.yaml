services:
  - type: web
    name: expense-tracker
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TURSO_URL
        value: libsql://expense-database-ajakusudaniel5.aws-us-east-2.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
