<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>StayOn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Auth -->
  <div id="auth-screen" class="screen auth-screen" style="display:none">
    <div class="auth-box">
      <div class="auth-logo">💰</div>
      <h1>StayOn</h1>
      <p class="muted auth-tagline">Know where your money is going. Stay on track until your next income.</p>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-auth="login">Log in</button>
        <button type="button" class="auth-tab" data-auth="signup">Sign up</button>
      </div>
      <form id="auth-form">
        <div class="field" id="auth-name-field" style="display:none">
          <label for="auth-name">Name</label>
          <input type="text" id="auth-name" placeholder="Your name" autocomplete="name">
        </div>
        <div class="field">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" placeholder="At least 6 characters" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary btn-block" id="auth-submit">Log in</button>
        <p id="auth-msg" class="form-error" style="display:none"></p>
      </form>
    </div>
  </div>

  <!-- Onboarding -->
  <div id="onboarding-screen" class="screen onboarding-screen" style="display:none">
    <div class="onboard-box">
      <div class="onboard-logo">🙌</div>
      <h2 id="onboard-title">What do you usually use the app for?</h2>
      <p class="muted" id="onboard-sub">This helps us set things up the right way.</p>
      <div id="onboard-options" class="onboard-options"></div>
      <div class="onboard-actions">
        <button type="button" class="btn-ghost" id="onboard-skip">Skip for now</button>
        <button type="button" class="btn-primary" id="onboard-next">Next</button>
      </div>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="screen app" style="display:none">
    <header class="topbar">
      <div class="brand">💰 <span>StayOn</span></div>
      <div class="header-right">
        <button type="button" class="icon-btn" id="lock-btn" title="Lock the app">🔒</button>
        <button type="button" class="avatar-btn" id="avatar-btn" title="Settings">?</button>
      </div>
    </header>

    <nav class="topnav">
      <button class="tab active" data-tab="home">Home</button>
      <button class="tab" data-tab="transactions">Transactions</button>
      <button class="tab" data-tab="budget">Budget</button>
      <button class="tab" data-tab="insights">Insights</button>
    </nav>

    <main>
      <section id="page-home" class="page active"></section>
      <section id="page-transactions" class="page"></section>
      <section id="page-budget" class="page"></section>
      <section id="page-insights" class="page"></section>
      <section id="page-settings" class="page"></section>
    </main>

    <button type="button" class="fab" id="fab" aria-label="Add transaction">+</button>

    <nav class="bottomnav">
      <button class="bn-item active" data-tab="home"><span class="bn-icon">🏠</span><span>Home</span></button>
      <button class="bn-item" data-tab="transactions"><span class="bn-icon">📄</span><span>Transactions</span></button>
      <button class="bn-item" data-tab="budget"><span class="bn-icon">🎯</span><span>Budget</span></button>
      <button class="bn-item" data-tab="insights"><span class="bn-icon">💡</span><span>Insights</span></button>
      <button class="bn-item" data-tab="settings"><span class="bn-icon">⚙️</span><span>Settings</span></button>
    </nav>
  </div>

  <!-- Add income modal -->
  <div id="income-modal" class="modal" style="display:none">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Add income</h2>
        <button type="button" class="modal-close" data-close="income-modal">&times;</button>
      </div>
      <form id="income-form">
        <div class="field">
          <label for="in-amount">Amount</label>
          <input type="number" id="in-amount" step="1" min="1" placeholder="0.00" required>
        </div>
        <div class="field">
          <label for="in-source">Source</label>
          <select id="in-source" required></select>
        </div>
        <div class="field">
          <label for="in-date">Date received</label>
          <input type="date" id="in-date" required>
        </div>
        <div class="field">
          <label for="in-note">Note <span class="muted">(optional)</span></label>
          <input type="text" id="in-note" placeholder="e.g. Salary, gift, side hustle">
        </div>
        <div class="field">
          <label>How long should this money last?</label>
          <div class="chip-row" id="in-period-chips">
            <button type="button" class="chip" data-days="7">7 days</button>
            <button type="button" class="chip" data-days="14">14 days</button>
            <button type="button" class="chip" data-days="30">30 days</button>
            <button type="button" class="chip" data-days="0">Until a date</button>
            <button type="button" class="chip" data-days="-1">No end date</button>
          </div>
          <input type="date" id="in-end-date" style="display:none" min="">
        </div>
        <button type="submit" class="btn-primary btn-block">Add income</button>
        <p id="income-msg" class="form-error" style="display:none"></p>
      </form>
    </div>
  </div>

  <!-- Transaction type selector modal -->
  <div id="tx-type-modal" class="modal" style="display:none">
    <div class="modal-box">
      <div class="modal-head">
        <h2>What do you want to add?</h2>
        <button type="button" class="modal-close" data-close="tx-type-modal">&times;</button>
      </div>
      <div class="tx-type-options">
        <button type="button" class="tx-type-btn income" id="tx-type-income">+ Income</button>
        <button type="button" class="tx-type-btn expense" id="tx-type-expense">− Expense</button>
      </div>
    </div>
  </div>

  <!-- Quick add expense modal -->
  <div id="expense-modal" class="modal" style="display:none">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Add expense</h2>
        <button type="button" class="modal-close" data-close="expense-modal">&times;</button>
      </div>
      <form id="expense-form">
        <div class="field">
          <label for="ex-amount">Amount</label>
          <input type="number" id="ex-amount" step="1" min="1" placeholder="0.00" required autofocus>
        </div>
        <div class="field">
          <label for="ex-category">Category</label>
          <select id="ex-category" required></select>
        </div>
        <div class="field">
          <label for="ex-date">Date</label>
          <input type="date" id="ex-date" required>
        </div>
        <div class="field">
          <label for="ex-note">Note <span class="muted">(optional)</span></label>
          <input type="text" id="ex-note" placeholder="e.g. Lunch">
        </div>
        <button type="submit" class="btn-primary btn-block">Add expense</button>
        <p id="expense-msg" class="form-error" style="display:none"></p>
      </form>
    </div>
  </div>

  <div id="toast-root"></div>

  <script src="app.js"></script>
</body>
</html>
