<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>💰 Expense Tracker</h1>
    <nav>
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="budgets">Budgets</button>
    </nav>
  </header>

  <main>
    <section id="tab-dashboard" class="tab-panel active">
      <div class="summary">
        <div class="card income-card">
          <span class="label">Income</span>
          <span class="value" id="sum-income">$0.00</span>
        </div>
        <div class="card expense-card">
          <span class="label">Expenses</span>
          <span class="value" id="sum-expense">$0.00</span>
        </div>
        <div class="card balance-card">
          <span class="label">Balance</span>
          <span class="value" id="sum-balance">$0.00</span>
        </div>
      </div>

      <div class="month-picker">
        <label for="month">Month</label>
        <input type="month" id="month">
      </div>

      <div class="layout">
        <div class="add-panel">
          <h2>Add Transaction</h2>
          <form id="add-form">
            <div class="field">
              <label for="t-type">Type</label>
              <select id="t-type">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>
            <div class="field">
              <label for="t-amount">Amount</label>
              <input type="number" id="t-amount" step="1" min="1" required placeholder="0.00">
            </div>
            <div class="field">
              <label for="t-date">Date</label>
              <input type="date" id="t-date" required>
            </div>
            <div class="field">
              <label for="t-category">Category</label>
              <select id="t-category" required></select>
            </div>
            <div class="field">
              <label for="t-note">Note</label>
              <input type="text" id="t-note" placeholder="Optional">
            </div>
            <button type="submit">Add</button>
          </form>
        </div>

        <div class="list-panel">
          <h2>Transactions</h2>
          <div id="tx-list" class="tx-list"></div>
          <div id="tx-empty" class="empty">No transactions for this month.</div>
        </div>
      </div>
    </section>

    <section id="tab-budgets" class="tab-panel">
      <h2>Budget Planner</h2>
      <div id="budgets"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
